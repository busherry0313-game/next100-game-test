 }

 if(cloudSessionKey===identity&&cloudSession&&cloudSession.expires_at>Date.now()/1000+60)return cloudSession.access_token;
 if(cloudTokenPromise)return cloudTokenPromise;
 cloudTokenPromise=(async()=>{
  const storageKey='next100-cloud-session-v1';

   throw Error('无法读取已保存的云端身份。为保护历史账号，已停止自动登录，请检查浏览器存储权限。');

   try{localStorage.setItem(storageKey,JSON.stringify(session))}catch(e){throw Error('无法保存续期后的云端身份，请检查浏览器存储权限。')}
   cloudSession=session;cloudSessionKey=identity;return session.access_token;
  }
  // No identity was saved for this project: allow a first-time anonymous sign-in.
  // Do not overwrite an identity belonging to a different configured project.
  if(saved&&saved.config!==c.url)throw Error('检测到另一个 Supabase 项目的身份记录，已停止自动覆盖，请检查云端设置。');

function bestRunRecord(){

 const valid=x=>x&&x.rankSeason==='launch-v1'&&Number.isInteger(Number(x.floor))&&Number(x.floor)>=1&&Number(x.floor)<=100&&x.bones!==undefined&&x.bones!==null&&x.bones!==''&&Number.isInteger(Number(x.bones))&&Number(x.bones)>=0&&['月','灿'].includes(x.character)&&typeof x.date==='string'&&!Number.isNaN(Date.parse(x.date));
 const candidates=[r.launchBestRun,...r.history].filter(valid);
 candidates.sort((a,b)=>Number(b.floor)-Number(a.floor)||Number(b.bones)-Number(a.bones)||String(a.date).localeCompare(String(b.date)));
 return candidates[0]||null;
}

ng:6px;font-size:11px}.mode-switch{width:46px}}\n<\/style><\/head><body><main class=\"frame\"><header class=\"header\"><div class=\"topline\"><button class=\"back\" type=\"button\">◀ 返回<\/button><div class=\"top-actions\"><button class=\"nickname-edit\" id=\"nicknameEdit\" type=\"button\">修改昵称<\/button><button class=\"mode-switch\" id=\"modeSwitch\" type=\"button\" aria-label=\"切换到普通模式\">普通<\/button><\/div><\/div><div class=\"title\" id=\"rankTitle\">排行榜・困难<\/div><p class=\"tagline\"><span id=\"modeIndicator\">✦ 困难模式排行榜 ✦<\/span> · 向着更好的自己<\/p><div class=\"rules\"><div class=\"rules-title\">排名规则<\/div><div>最高到达层数优先<\/div><div>同层时本局拾取狗骨头越多越靠前<\/div><div>完全相同时按提交先后<\/div><\/div><div class=\"key\">角色标识：🌙 / 🌋 代表使用的角色，与皮肤无关<\/div><\/header><div class=\"listbar\"><span>名次<\/span><span>玩家<\/span><span>层数<\/span><span>🦴 骨头<\/span><\/div><section class=\"list\" aria-label=\"全服排行榜\" role=\"list\" id=\"rankEntries\"><\/section><footer class=\"bottom\"><div class=\"yourtitle\"><span>✦ 我的最佳成绩<\/span><span id=\"myPosition\">个人排名 · 暂无记录<\/span><\/div><div class=\"you\" id=\"myEntry\"><\/div><div class=\"note\" id=\"tip\">UI 示例数据 · 非真实排名<\/div><\/footer><\/main><script>\nfunction esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]))}\nfunction fmt(r,i,isSelf){const rank=isSelf?'我的':i<3?['🥇','🥈','🥉'][i]:String(i+1).padStart(2,'0');const symbol=r.character==='灿'?'🌋':'🌙';return `<div class=\"rank\">${rank}<\/div><div class=\"person\"><span class=\"character\">${symbol}<\/span><span class=\"nick\">${esc(r.nickname||r.player_id||'玩家')}<\/span><\/div><div class=\"floor\">${Math.max(0,Number(r.best_floor)||0)}<small>层<\/small><\/div><div class=\"bones\">${Math.max(0,Number(r.best_bones)||0)}<\/div>`}\nwindow.addEventListener('message',e=>{if(!e.data||e.data.type!=='next100-rank-data')return;const payload=e.data;const all=payload.rows||[];const list=document.getElementById('rankEntries');list.replaceChildren();all.slice(0,20).forEach((r,i)=>{const entry=document.createElement('div');entry.className='entry'+(i<3?' podium p'+(i+1):'');entry.setAttribute('role','listitem');entry.innerHTML=fmt(r,i,false);list.appendChild(entry)});if(!all.length){list.innerHTML='<p style=\"text-align:center;padding:26px 8px;background:#14345f;color:#ffe5ac\">暂无排行记录，快来挑战吧！<\/p>'}const self=payload.self;document.getElementById('myEntry').innerHTML=self?fmt(self,Math.max(0,payload.position-1),true):'<span style=\"grid-column:1/-1;text-align:center\">暂无本局骨头纪录<\/span>';document.getElementById('myPosition').textContent='个人排名 · '+(payload.position?'第 '+payload.position+' 名':'尚未上榜');document.getElementById('tip').textContent=payload.message||'最高到达层数优先；同层时本局骨头数越多越靠前';});\ndocument.querySelector('.back').addEventListener('click',()=>parent.postMessage({type:'next100-rank-back'},'*'));\nlet currentMode='hard';\nconst switchBtn=document.getElementById('modeSwitch');\nfunction drawMode(){\n const hard=currentMode==='hard';\n switchBtn.textContent=hard?'普通':'困难';\n switchBtn.setAttribute('aria-label',hard?'切换到普通模式':'切换到困难模式');\n document.getElementById('rankTitle').textContent=hard?'排行榜・困难':'排行榜・普通';\n document.getElementById('modeIndicator').textContent=hard?'✦ 困难模式排行榜 ✦':'✦ 普通模式排行榜 ✦';\n parent.postMessage({type:'next100-rank-mode',mode:currentMode},'*');\n}\nswitchBtn.addEventListener('click',()=>{currentMode=currentMode==='hard'?'normal':'hard';drawMode()});\ndocument.getElementById('nicknameEdit').addEventListener('click',()=>parent.postMessage({type:'next100-rank-edit-nickname'},'*'));\ndrawMode();\n<\/script><\/body><\/html>";
// Hard leaderboard uses a dedicated optional Supabase table; normal mode table remains untouched.
function hardLocalRow(){
 const r=readHardRecord();
 return r.bestFloor?{player_id:MY_PLAYER_ID,nickname:displayName(),best_floor:r.bestFloor,
 best_bones:r.bestBones,character:r.character,achieved_at:r.date||new Date().toISOString()}:null;
}
async function submitHardBest(){
 if(!cloudConfig())return;
 const record=hardLocalRow();if(!record)return;
 await getCloudToken();
 const uid=cloudSession.user_id;if(!uid)throw Error('无法取得匿名玩家身份');
 const endpoint='/rest/v1/next100_hard_leaderboard';
 const rows=await cloudRequest(endpoint+'?select=best_floor,best_bones,achieved_at&user_id=eq.'+encodeURIComponent(uid),{},true);
 const old=rows?.[0];
 if(old&&(Number(old.best_floor)>record.best_floor||
  (Number(old.best_floor)===record.best_floor&&Number(old.best_bones)>=record.best_bones)))return;
 await cloudRequest(endpoint+'?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
 body:JSON.stringify({user_id:uid,...record})},true);
}
function hardRankPayload(rows,message){
 const local=hardLocalRow();const set=Array.isArray(rows)?rows.slice():[];
 if(local&&!set.some(r=>r.player_id===MY_PLAYER_ID))set.push(local);
 set.sort((a,b)=>Number(b.best_floor)-Number(a.best_floor)||Number(b.best_bones)-Number(a.best_bones)||String(a.achieved_at||'').localeCompare(String(b.achieved_at||'')));
 const seen=new Set(),unique=set.filter(r=>{const id=String(r.player_id||'').trim();if(!id)return true;if(seen.has(id))return false;seen.add(id);return true});
 const pos=unique.findIndex(r=>r.player_id===MY_PLAYER_ID);
 return {type:'next100-rank-data',rows:unique.slice(0,20),self:pos>=0?unique[pos]:local,position:pos>=0?pos+1:0,message};
}
function rankPayload(rows,message){
 const mine=bestRunRecord();const local=mine?{player_id:MY_PLAYER_ID,nickname:displayName(),best_floor:mine.floor,best_bones:mine.bones,character:mine.character,achieved_at:mine.date}:null;
 // On an unconfigured client, show only its own verified run; no invented cloud players.
 const set=Array.isArray(rows)?rows.slice():[];
 if(local&&!set.some(r=>r.player_id===MY_PLAYER_ID))set.push(local);
 // V1.9.17: cloud anonymous accounts may differ for one stable local player ID.
 // Keep the best-ranked entry per player ID; distinct players sharing a nickname remain separate.
 set.sort((a,b)=>Number(b.best_floor)-Number(a.best_floor)||Number(b.best_bones)-Number(a.best_bones)||String(a.achieved_at||'').localeCompare(String(b.achieved_at||'')));
 const seenPlayers=new Set();
 const unique=set.filter(r=>{const id=String(r.player_id||'').trim();if(!id)return true;if(seenPlayers.has(id))return false;seenPlayers.add(id);return true;});
 const pos=unique.findIndex(r=>r.player_id===MY_PLAYER_ID);
 return {type:'next100-rank-data',rows:unique.slice(0,20),self:pos>=0?unique[pos]:local,position:pos>=0?pos+1:0,message};
}
let rankMode='hard',rankLoadSeq=0;
async function leaderboard(){
 mode='leaderboard';rankMode='hard';hidePlay();overlay.className='rank-book-overlay';overlay.classList.remove('hidden');
 document.querySelectorAll('.rank-profile-settings,.rank-cloud-settings').forEach(x=>x.remove());
 const f=document.createElement('iframe');f.id='rank-book-frame';f.setAttribute('title','双模式排行榜');
 f.setAttribute('sandbox','allow-scripts');panel.replaceChildren(f);
 f.srcdoc=RANK_BOOK_HTML;
}
async function loadRankMode(modeName){
 if(mode!=='leaderboard')return;
 const f=document.getElementById('rank-book-frame');if(!f||!f.contentWindow)return;
 const seq=++rankLoadSeq;
 const send=(payload)=>{if(mode==='leaderboard'&&rankMode===modeName&&seq===rankLoadSeq&&f.isConnected)
  f.contentWindow.postMessage(payload,'*')};
 if(modeName==='hard'){
  send(hardRankPayload([],cloudConfig()?'正在获取困难模式成绩…':'困难模式本地纪录 · 尚未连接云端'));
  if(!cloudConfig())return;
  try{
   await submitHardBest();
   const rows=await cloudRequest('/rest/v1/next100_hard_leaderboard?select=player_id,nickname,best_floor,best_bones,character,achieved_at&order=best_floor.desc,best_bones.desc,achieved_at.asc&limit=1000',{},true);
   send(hardRankPayload(rows,'困难模式云端排行榜 · 前20名 + 我的最佳成绩'));
  }catch(e){send(hardRankPayload([],'困难模式云端表尚未启用／连接失败 · 当前显示本地纪录'))}
  return;
 }
 send(rankPayload([],cloudConfig()?'正在获取普通模式成绩…':'普通模式本地成绩 · 云端尚未配置'));
 if(!cloudConfig())return;
 try{
  await submitBest();
  const rows=await cloudRequest('/rest/v1/next100_bone_leaderboard?select=player_id,nickname,best_floor,best_bones,character,achieved_at&order=best_floor.desc,best_bones.desc,achieved_at.asc&limit=1000',{},true);
  send(rankPayload(rows,'普通模式云端排行榜 · 前20名 + 我的最佳成绩'+legacyBestNotice()));
 }catch(e){send(rankPayload([],'普通模式云端连接失败 · 已显示本地纪录'))}
}
window.addEventListener('message',e=>{
 if(mode!=='leaderboard'||!e.data)return;
 const f=document.getElementById('rank-book-frame');if(!f||e.source!==f.contentWindow)return;
 if(e.data.type==='next100-rank-mode'&&(e.data.mode==='hard'||e.data.mode==='normal')){
  rankMode=e.data.mode;loadRankMode(rankMode);
 }else if(e.data.type==='next100-rank-edit-nickname')editRankNickname();
});

 深蓝金框 */\n:root{--navy:#153561;--blue:#27679c;--gold:#f1cb76;--ink:#e9f2ff}\nbody{font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;background:#142847;color:var(--ink)}\n.shell{background:#8bbddd url(\"assets/img_31cf0255f954c7e3.svg\") center / 100% 100% no-repeat;box-shadow:0 0 0 4px #102a52,0 0 0 7px #cda963,0 22px 90px #060f22}\n.shell:before,.shell:after{display:none}\n.head{padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;background:linear-gradient(180deg,#18355eeF 0%,#215384f5 100%);border-bottom:4px solid #e7bf75;box-shadow:inset 0 -5px #102849,0 6px 0 #11305077;color:#fff}\n.head:after{bottom:-9px;height:3px;background:repeating-linear-gradient(90deg,#ffe9a8 0 8px,#c09049 8px 12px,#193f71 12px 16px)}\n.headtop{grid-template-columns:76px 1fr 46px;min-height:38px}\n.back{height:34px;border:2px solid #e1ba75;background:#225587;color:#fff3ce;border-radius:0;box-shadow:inset 0 0 0 2px #345e8c,3px 3px 0 #102745;font-size:12px;font-weight:800}\n.back:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 2px #345e8c,1px 1px 0 #102745}\n.headmark{letter-spacing:5px;color:#ffe2a2}\n.heading{font-size:clamp(23px,6vw,31px);letter-spacing:3px;color:#fff5c6;text-shadow:2px 2px 0 #956c33,4px 4px 0 #0e3159,-1px -1px 0 #fff,0 0 9px #a1d7ff;margin:2px 0 0}\n.sub{font-size:11px;color:#d8eafa;letter-spacing:1px;margin:5px 0 12px}\n.progress{border:3px solid #e6bd70;border-radius:0;background:#102f59;box-shadow:inset 0 0 0 3px #31619a,4px 4px 0 #0e294d;padding:10px 12px 11px;color:#e4ecfb}\n.progressline{font-size:12px}.progressline strong{color:#ffe29a;font-size:18px}\n.track{height:12px;margin-top:9px;border:2px solid #99bbe0;border-radius:0;background:repeating-linear-gradient(90deg,#2b5280 0 calc(12.5% - 2px),#102a4d calc(12.5% - 2px) 12.5%);box-shadow:inset 0 2px #172f52}\n.fill{background:repeating-linear-gradient(90deg,#f8d988 0 calc(33.333% - 3px),#bd8745 calc(33.333% - 3px) 33.333%);border-radius:0;box-shadow:inset 0 2px #fff4ba}\n.tabs{gap:6px;margin-top:11px;flex-wrap:wrap}\n.tabs button{border:2px solid #8ab7da;border-radius:0;background:#153e70;color:#e5f1ff;padding:6px 9px;font-weight:700;font-size:10px;box-shadow:2px 2px 0 #0e2647}\n.tabs button.current{border-color:#f6d38b;background:#f3d18c;color:#15345e;box-shadow:2px 2px 0 #8a6331}\n.caption{font-size:10px;color:#bddeec;margin-top:7px}\n.list{padding:17px 12px calc(35px + env(safe-area-inset-bottom));scrollbar-color:#dbb66c #2d6798;image-rendering:auto}\n.section{font-size:12px;color:#123b68;letter-spacing:2px;padding:5px 4px 11px;text-shadow:1px 1px 0 #fff5d7}\n.section:after{height:3px;background:repeating-linear-gradient(90deg,#d6a85d 0 14px,#fff2c7 14px 18px,transparent 18px 23px)}\n.card{border:3px solid #edc379;border-radius:0;gap:9px;min-height:128px;margin-bottom:13px;padding:8px 10px 8px 5px;background:linear-gradient(120deg,#183e71f5,#24558bfa 65%,#1a477bf7);box-shadow:inset 0 0 0 3px #4775a1,0 0 0 2px #153b65,5px 5px 0 #0c315a80;clip-path:polygon(9px 0,calc(100% - 9px) 0,calc(100% - 9px) 5px,100% 5px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 8px),0 calc(100% - 8px),0 8px,9px 8px)}\n.card:before{content:'✦';font-size:13px;color:#e8c478;right:12px;top:9px}\n.card:after{left:8px;right:8px;top:4px;height:2px;background:repeating-linear-gradient(90deg,#7bb4e2 0 12px,transparent 12px 17px)}\n.card.locked{background:linear-gradient(120deg,#34485feF,#364d67f5);border-color:#8c9aae;box-shadow:inset 0 0 0 3px #526b86,0 0 0 2px #24415d,5px 5px 0 #20314988}\n.badgepic{width:110px;height:110px;flex:0 0 110px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(2px 4px 0 #0a244e82)}\n.locked .badgepic{filter:grayscale(1) brightness(.64) opacity(.78)}\n.name{color:#fff1bd;font-size:18px;line-height:1.45;letter-spacing:.7px;text-shadow:2px 2px 0 #0b305c}\n.locked .name{color:#c4cbd7}\n.state{border:1px solid #eac780;border-radius:0;background:#946c30;color:#fff9d5;font-size:9px;padding:2px 4px;text-shadow:none}\n.locked .state{border-color:#8c98a8;background:#394b60;color:#cad3df}\n.condition{color:#ffe3a3;font-size:11px;margin-top:5px}\n.locked .condition{color:#bdcbd9}\n.description{font-size:11px;color:#d3e6fa;line-height:1.65;margin-top:7px}\n.locked .description{color:#aebdcc}\n.closing{color:#15385c;text-shadow:1px 1px #f4fbff;font-weight:800}\n.footstar{color:#d1a45a;text-shadow:1px 1px #fff}\n.footerline{background:#153861;color:#d3e9ff;border-top:3px solid #e4bd73;padding:8px}\n@media(max-width:360px){.card{min-height:111px;padding:8px 7px 8px 2px;gap:3px}.badgepic{width:91px;height:91px;flex-basis:91px}.name{font-size:15px}.description{font-size:10px}.state{font-size:8px}.head{padding-left:9px;padding-right:9px}}\n\n/* V4: 用户定稿的蓝色像素云海背景及高对比度分类标题 */\n.list{\n  background-image:linear-gradient(180deg,rgba(9,38,77,.15),rgba(9,40,81,.20)),url(\"assets/img_885ab51ef41812be.webp\");\n  background-repeat:no-repeat;\n  background-size:cover;\n  background-position:center top;\n  background-color:#6cb4e8;\n}\n.section{\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  width:100%;\n  min-height:43px;\n  margin:5px 0 15px;\n  padding:9px 12px;\n  background:#173d70ee;\n  color:#fff2c8;\n  border:3px solid #dcb96e;\n  border-radius:0;\n  box-shadow:inset 0 0 0 2px #436b99,3px 3px 0 #10294ccc;\n  font-size:clamp(14px,3.8vw,17px);\n  font-weight:900;\n  letter-spacing:2px;\n  line-height:1.4;\n  text-shadow:1px 1px 0 #092b50,-1px -1px 0 #092b50,0 1px 0 #092b50;\n}\n.section::before{content:'✦';font-size:11px;color:#f4d58b;margin-right:8px;flex:none}\n.section::after{content:'✦';display:block;height:auto;background:none;flex:none;font-size:11px;color:#f4d58b;margin-left:8px}\n@media(max-width:360px){.section{font-size:14px;letter-spacing:1px}}\n\n.coming-badge{width:110px;height:110px;flex:0 0 110px;display:flex;align-items:center;justify-content:center;text-align:center;border:3px solid #9ba8b6;background:linear-gradient(145deg,#667487,#394b62);color:#e1e6ed;font-size:15px;font-weight:800;letter-spacing:1px;line-height:1.6;box-shadow:inset 0 0 0 4px #526176,2px 4px 0 #11263f;image-rendering:pixelated}\n.card.coming .name{color:#e1e6ee}.card.coming .condition{color:#bbc6d4}.card.coming .description{color:#a9b8cb}\n@media(max-width:360px){.coming-badge{width:91px;height:91px;flex-basis:91px;font-size:12px}}\n<\/style><\/head><body><div class=\"shell\"><header class=\"head\"><div class=\"headtop\"><button class=\"back\" id=\"back\" aria-label=\"返回\">❮ 返回<\/button><div class=\"headmark\">✧ ✦ ✧<\/div><div class=\"bookicon\">☾ ✦<\/div><\/div><h1 class=\"heading\">月灿成就册<\/h1><p class=\"sub\">每一段旅途，都值得闪闪发光<\/p><div class=\"progress\" title=\"独立预览：成就与累计数字为演示数据，正式版接入游戏存档\"><div class=\"progressline\"><span>✦ 星光收藏进度<\/span><span>已解锁 <strong id=\"done\">3<\/strong> / 8<\/span><\/div><div class=\"track\"><div class=\"fill\" id=\"fill\"><\/div><\/div><\/div><\/header><main class=\"list\" id=\"list\" tabindex=\"0\"><\/main><div class=\"footerline\">✧ 下一百层 · 月灿旅途 ✧<\/div><\/div>\n<script>\nconst achievements=[{\"name\": \"月下初逢\", \"condition\": \"首次到达20层\", \"description\": \"故事从月光下开始\", \"group\": \"章节旅程\", \"source\": \"assets/img_a59a942efbfd9992.webp\"}, {\"name\": \"灿然心动\", \"condition\": \"首次到达40层\", \"description\": \"从相遇到悄悄心动\", \"group\": \"章节旅程\", \"source\": \"assets/img_fb7830011127e4e4.webp\"}, {\"name\": \"星月相映\", \"condition\": \"首次到达60层\", \"description\": \"月亮与星光开始彼此照亮\", \"group\": \"章节旅程\", \"source\": \"assets/img_f8b894d11317b38d.webp\"}, {\"name\": \"双向奔赴\", \"condition\": \"首次到达80层\", \"description\": \"距离终点越来越近，心也越来越近\", \"group\": \"章节旅程\", \"source\": \"assets/img_198ab8b1fb667999.webp\"}, {\"name\": \"星月灿烂\", \"condition\": \"首次通关100层\", \"description\": \"终于抵达属于两个人的圆满\", \"group\": \"章节旅程\", \"source\": \"assets/img_d5880e6e9840573d.webp\"}, {\"name\": \"狗毛上头\", \"condition\": \"累计挑战50次\", \"description\": \"狗毛的坚持，永远不认输\", \"group\": \"狗毛的坚持\", \"source\": \"assets/img_8c0679d152a5f641.webp\"}, {\"name\": \"为爱发电\", \"condition\": \"累计挑战100次\", \"description\": \"为了好朋狗，再来一百次也愿意\", \"group\": \"狗毛的坚持\", \"source\": \"assets/img_faa420a73e89ac12.webp\"}, {\"name\": \"狗毛认证\", \"condition\": \"累计收集50个狗骨头\", \"description\": \"恭喜成为官方认证的资深狗毛\", \"group\": \"狗毛收藏家\", \"source\": \"assets/img_9bb5e3f614e4fafd.webp\"}];\nlet unlockedCount=0; let achievementUnlocked={};\n// 独立美术预览的模拟进度；正式游戏整合时需从真实存档赋值。\nlet achievementProgress={attempts:0,bones:0};\nfunction completedProgress(value,max){return Math.min(max,Math.max(0,Math.floor(Number(value)||0)))+'/'+max}\n// 对外预留更新接口：window.setAchievementProgress({attempts:...,bones:...})\nwindow.setAchievementProgress=function(next){\n if(next&&Number.isFinite(Number(next.attempts))) achievementProgress.attempts=Math.max(0,Math.floor(Number(next.attempts)));\n if(next&&Number.isFinite(Number(next.bones))) achievementProgress.bones=Math.max(0,Math.floor(Number(next.bones)));\n const previousTop=container.scrollTop;render();container.scrollTop=previousTop;\n};\nconst container=document.getElementById('list');\nfunction render(){let currentGroup='';container.innerHTML='';achievements.forEach((a,i)=>{if(a.group!==currentGroup){currentGroup=a.group;const label=document.createElement('div');label.className='section';label.textContent='✦ '+currentGroup;container.appendChild(label)}const unlocked=!!achievementUnlocked[a.name];const card=document.createElement('article');card.className='card'+(unlocked?'':' locked');const pic=document.createElement('img');pic.src=a.source;pic.alt=a.name+'徽章';pic.className='badgepic';const copy=document.createElement('div');copy.className='copy';const name=document.createElement('div');name.className='name';name.textContent=a.name;const state=document.createElement('span');state.className='state';state.textContent=unlocked?'已解锁':'未解锁';name.appendChild(state);const condition=document.createElement('div');condition.className='condition';const cumulativeLimit= a.name==='狗毛上头'?50:a.name==='为爱发电'?100:a.name==='狗毛认证'?50:null;\nconst actualValue=a.name==='狗毛认证'?achievementProgress.bones:achievementProgress.attempts;\ncondition.textContent='达成条件 · '+a.condition+(cumulativeLimit!==null?'（'+completedProgress(actualValue,cumulativeLimit)+'）':'');const desc=document.createElement('div');desc.className='description';desc.textContent=a.description;copy.append(name,condition,desc);card.append(pic,copy);container.appendChild(card)});// 困难模式暂不设置解锁条件，仅展示预留成就条目；不计入8枚普通勋章进度。\nconst hardSection=document.createElement('div');hardSection.className='section';hardSection.textContent='✦ 勇闯难关的狗毛';container.appendChild(hardSection);\nconst hardCard=document.createElement('article');hardCard.className='card locked coming';\nconst placeholder=document.createElement('div');placeholder.className='coming-badge';placeholder.textContent='正在\\n制作中';placeholder.style.whiteSpace='pre-line';\nconst hardCopy=document.createElement('div');hardCopy.className='copy';\nconst hardTitle=document.createElement('div');hardTitle.className='name';hardTitle.textContent='困难模式勋章';\nconst hardState=document.createElement('span');hardState.className='state';hardState.textContent='筹备中';hardTitle.appendChild(hardState);\nconst hardCondition=document.createElement('div');hardCondition.className='condition';hardCondition.textContent='达成条件 · 敬请期待';\nconst hardDescription=document.createElement('div');hardDescription.className='description';hardDescription.textContent='全新挑战的专属荣誉，正在制作中';\nhardCopy.append(hardTitle,hardCondition,hardDescription);hardCard.append(placeholder,hardCopy);container.appendChild(hardCard);\nconst ending=document.createElement('div');ending.className='closing';ending.textContent='愿星月相伴，下一百层也一起出发';container.appendChild(ending);const symbol=document.createElement('div');symbol.className='footstar';symbol.textContent='✦ ☾ ✧';container.appendChild(symbol);document.getElementById('done').textContent=unlockedCount;document.getElementById('fill').style.width=(unlockedCount/8*100)+'%';}\ndocument.getElementById('back').addEventListener('click',()=>parent.postMessage({type:'next100-ach-back'},'*'));\nwindow.addEventListener('message',e=>{if(e.source!==parent||!e.data||e.data.type!=='next100-ach-state')return;\n const d=e.data; achievementUnlocked=d.unlocked||{}; achievementProgress={attempts:Math.max(0,Number(d.attempts)||0),bones:Math.max(0,Number(d.bones)||0)};\n unlockedCount=Object.values(achievementUnlocked).filter(Boolean).length;render();});render();\n<\/script><\/body><\/html>";
const ACHIEVEMENT_KEY='next100-achievements-v2';
let runAchievementTracking=false;
const runNewAchievements=new Set(); // 记录本次挑战从开始到结算的全部新解锁成就
let achievementStartSnapshot=new Set();
const ACHIEVEMENTS=[
 {id:'reach20',name:'月下初逢',description:'故事从月光下开始',target:20,kind:'floor'},
 {id:'reach40',name:'灿然心动',description:'从相遇到悄悄心动',target:40,kind:'floor'},
 {id:'reach60',name:'星月相映',description:'月亮与星光开始彼此照亮',target:60,kind:'floor'},
 {id:'reach80',name:'双向奔赴',description:'距离终点越来越近，心也越来越近',target:80,kind:'floor'},
 {id:'win100',name:'星月灿烂',description:'终于抵达属于两个人的圆满',target:1,kind:'win'},
 {id:'plays50',name:'狗毛上头',description:'狗毛的坚持，永远不认输',target:50,kind:'plays'},
 {id:'plays100',name:'为爱发电',description:'为了好朋狗，再来一百次也愿意',target:100,kind:'plays'},
 {id:'bones50',name:'狗毛认证',description:'恭喜成为官方认证的资深狗毛',target:50,kind:'bones'}
];
const ACH_PLAY_KEY='next100-actual-challenges-v1',ACH_BONE_KEY='next100-collected-bones-v1', ACH_FLOOR_KEY='next100-reached-floor-v1';
function readAchCounter(key){try{return Math.max(0,Number(localStorage.getItem(key))||0)}catch(e){return 0}}
let achPlayCount=Math.max(readAchCounter(ACH_PLAY_KEY),Number(readRecords().total)||0);
let achBoneCount=readAchCounter(ACH_BONE_KEY);
let achReachedFloor=Math.max(readAchCounter(ACH_FLOOR_KEY),Number(readRecords().bestFloor)||0);
function saveAchCounter(key,value){try{localStorage.setItem(key,String(value))}catch(e){}}
function countNewChallenge(){if(difficulty==='hard')return;achPlayCount++;saveAchCounter(ACH_PLAY_KEY,achPlayCount);syncAchievements()}
function countCollectedBone(){if(difficulty==='hard')return;achBoneCount++;saveAchCounter(ACH_BONE_KEY,achBoneCount);syncAchievements()}
function countReachedFloor(floor){if(difficulty==='hard')return;if(floor>achReachedFloor){achReachedFloor=floor;saveAchCounter(ACH_FLOOR_KEY,floor);syncAchievements()}}
function readAchievements(){try{const v=JSON.parse(localStorage.getItem(ACHIEVEMENT_KEY)||'{}');return v&&typeof v==='object'&&!Array.isArray(v)?v:{}}catch(e){return {}}}
function achievementProgress(a,r){return a.kind==='floor'?Math.max(achReachedFloor,Number(r.bestFloor)||0):a.kind==='win'?(Number(r.wins)||0):a.kind==='bones'?achBoneCount:achPlayCount}
function syncAchievements(){
 const r=readRecords(),saved=readAchievements(),unlocked=[];
 for(const a of ACHIEVEMENTS){if(achievementProgress(a,r)>=a.target&&!saved[a.id]){saved[a.id]=new Date().toISOString();unlocked.push(a);if(runAchievementTracking)runNewAchievements.add(a.id)}}
 if(unlocked.length){try{localStorage.setItem(ACHIEVEMENT_KEY,JSON.stringify(saved))}catch(e){}}
 return {saved,unlocked};
}
function achievementSummary(){const r=syncAchievements();return `<p class="sub">🏅 已解锁 ${ACHIEVEMENTS.filter(a=>!!r.saved[a.id]).length} / 8 项成就</p>`}
function achievements(){
 mode='achievements';hidePlay();overlay.className='achievement-book-overlay';
 const state=syncAchievements().saved;
 const iframe=document.createElement('iframe');iframe.id='achievement-book-frame';iframe.setAttribute('title','月灿成就册');
 iframe.setAttribute('sandbox','allow-scripts');iframe.setAttribute('scrolling','no');
 panel.replaceChildren(iframe);
 iframe.addEventListener('load',()=>{
   if(iframe.isConnected&&mode==='achievements'){
    const message={type:'next100-ach-state',unlocked:Object.fromEntries(ACHIEVEMENTS.map(a=>[a.name,!!state[a.id]])),attempts:achPlayCount,bones:achBoneCount};
    iframe.contentWindow.postMessage(message,'*');
   }
 });

 }else{
   rrect(p.x,y,p.w,13,4,'#d4c6b4','#fff5e5');
 }
 if(p.type==='goal'){ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.fillText('🏆 第100层',p.x+9,y-5)}}for(const h of heals){if(h.taken)continue;let y=h.y-camY;if(y<0||y>H)continue;// Use the exact golden life-bone artwork for healing pickups.
const boneImg=healBoneImage;
if(boneImg.complete&&boneImg.naturalWidth){
  const boneW=28,boneH=23;
  ctx.save();
  ctx.shadowColor='#ffeaa3';ctx.shadowBlur=7;
  ctx.drawImage(boneImg,h.x-boneW/2,y-boneH/2,boneW,boneH);

}else{
  ctx.fillStyle='#ffcc51';ctx.beginPath();ctx.arc(h.x,y,7,0,Math.PI*2);ctx.fill();
}}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.55);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y-camY,4,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
let ly=laserY-camY;ctx.fillStyle='#f25773';ctx.shadowColor='#ff546d';ctx.shadowBlur=20;ctx.fillRect(0,ly,W,11);ctx.shadowBlur=0;if(laserWarning){ctx.fillStyle='#f4576c22';ctx.fillRect(0,0,W,40)}let hy=hero.y-camY;refreshSpriteAction();drawSpriteHero(hy);}
if(mode==='menu'||mode==='choose'||mode==='tutorial'){ctx.globalAlpha=.25;ctx.fillStyle='#fff';for(let i=0;i<45;i++){let x=(i*89)%W,y=(i*113)%H;ctx.beginPath();ctx.arc(x,y,i%3+1,0,7);ctx.fill()}ctx.globalAlpha=1}}
function frame(now){prefetchAreaAssets();if(!last)last=now;let dt=Math.min((now-last)/1000,.05);last=now;stepAcc+=dt;while(stepAcc>=FIX){if(mode==='play'||mode==='count')update(FIX);stepAcc-=FIX}draw();requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(['ArrowLeft','ArrowRight','Space','Escape','KeyA','KeyD'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')keyboardLeft=true;if(e.code==='ArrowRight'||e.code==='KeyD')keyboardRight=true;if((e.code==='Escape'||e.code==='Space')&&!e.repeat){if(mode==='play'||mode==='count')pause();else if(mode==='pause')resume()}});window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keyboardLeft=false;if(e.code==='ArrowRight'||e.code==='KeyD')keyboardRight=false});
for(const b of document.querySelectorAll('.move')){let dir=Number(b.dataset.dir);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(dir<0)holdLeft=true;else holdRight=true;b.classList.add('pressed')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(dir<0)holdLeft=false;else holdRight=false;b.classList.remove('pressed')})}

panel.addEventListener('pointerdown', e=>{
  if(e.pointerType !== 'mouse' || e.button !== 0 || mode !== 'choose') return;
  const start=e.target.closest('button[data-action="difficulty"]');
  if(!start || start.disabled || !panel.contains(start)) return;
  e.preventDefault();
  e.stopPropagation();
  try { difficultyMenu(); } catch(err) { console.error('PC difficulty menu failed:',err); }

 if(mode==='choose'||mode==='difficulty'||mode==='count'){
